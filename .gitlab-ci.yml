image: node:18-alpine
variables:
  JEKYLL_ENV: production
  LC_ALL: C.UTF-8

before_script:
  # pull plugins from their source repo
  - apk add --no-cache git
  - cd plugin
  - rm -r -f reveal.js-menu
  - rm -r -f reveal.js-plugins
  - git clone https://github.com/denehyg/reveal.js-menu.git
  - git clone https://github.com/rajgoel/reveal.js-plugins.git
  - cd ..

# provide full repository as static git-page
pages:
  tags:
    - npm
    # added tjkc14 tag to use my own runner since the shared one is having issues a lot. 
    # feel free to comment this out or tag your own runner. If need be i can ask for a seperate shared runner.
    - tjkc14
  stage: deploy
  script:
    - mkdir .public
    - cp -r * .public
    - mv .public public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  